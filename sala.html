<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de control · JARVIS</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="css/jarvis.css">
  <style>
    body { overflow: hidden; }
    .sala { height: 100dvh; display: grid; grid-template-rows: auto 1fr; padding: 2vh 2vw; gap: 2vh; }
    .sala-cabeza { display: flex; align-items: center; gap: 2vw; flex-wrap: wrap; }
    .sala-cabeza h1 { font-size: clamp(20px, 2.6vw, 44px); margin: 0; letter-spacing: 0.14em; }
    .sala-cabeza h1 small { display: block; font-size: 0.4em; color: var(--rojo); letter-spacing: 0.4em; }
    .contador { font-family: var(--titulo); font-size: clamp(20px, 2.4vw, 40px); color: var(--acento); text-align: right; }
    .contador span { display: block; font-size: 0.38em; color: var(--tenue); letter-spacing: 0.15em; }
    .rejilla { display: grid; gap: 1.4vh 1.2vw; grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 15vw, 260px), 1fr)); align-content: start; overflow: hidden; }
    .tarjeta-eq { position: relative; display: grid; justify-items: center; text-align: center; gap: 0.4vh; padding: 1.2vh 0.8vw; border-radius: 16px; border: 1px solid var(--borde); background: rgba(0, 0, 0, 0.5); }
    .tarjeta-eq canvas { width: clamp(70px, 8vw, 140px); height: clamp(70px, 8vw, 140px); }
    .tarjeta-eq .j { font-family: var(--titulo); font-weight: 800; letter-spacing: 0.12em; font-size: clamp(14px, 1.3vw, 24px); }
    .tarjeta-eq .e { color: var(--tenue); font-size: clamp(13px, 1vw, 18px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .tarjeta-eq .s { font-size: clamp(11px, 0.85vw, 15px); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
    .tarjeta-eq.linea { border-color: var(--c); box-shadow: 0 0 24px color-mix(in srgb, var(--c) 35%, transparent); }
    .tarjeta-eq.linea .s { color: var(--verde); }
    .tarjeta-eq .mini-barra { width: 80%; height: 5px; border-radius: 9px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
    .tarjeta-eq .mini-barra i { display: block; height: 100%; background: var(--c); }
    .tarjeta-eq .medalla { position: absolute; top: 8px; right: 10px; font-size: clamp(14px, 1.2vw, 22px); }
    .marcador { display: grid; gap: 1vh; align-content: start; max-width: 1400px; width: 100%; margin: 0 auto; overflow: hidden; }
    .fila-m { display: grid; grid-template-columns: 4vw 1fr auto auto; align-items: center; gap: 1.5vw; padding: 1.2vh 1.5vw; border-radius: 14px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--borde); font-size: clamp(16px, 1.6vw, 30px); }
    .fila-m .pos { font-family: var(--titulo); color: var(--acento); }
    .fila-m .pts { font-family: var(--titulo); font-size: 1.3em; color: var(--acento); min-width: 5ch; text-align: right; }
    .piezas { display: flex; gap: 0.4vw; }
    .piezas i { width: 1.1em; height: 1.1em; border-radius: 4px; border: 2px solid var(--borde); }
    .piezas i.si { background: var(--verde); border-color: var(--verde); box-shadow: 0 0 8px var(--verde); }
    .vacio { grid-column: 1 / -1; text-align: center; color: var(--tenue); font-size: clamp(18px, 2vw, 32px); margin-top: 10vh; }
    .controles { display: flex; gap: 8px; }
    .encendido-grande { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; text-align: center; background: rgba(0, 0, 0, 0.85); }
    .encendido-grande canvas { width: 34vh; height: 34vh; }
    .encendido-grande .t1 { font-family: var(--titulo); font-size: 7vh; letter-spacing: 0.16em; font-weight: 800; }
    .encendido-grande .t2 { font-size: 3.4vh; color: var(--tenue); }
    .encendido-grande .t3 { font-family: var(--titulo); color: var(--verde); letter-spacing: 0.4em; font-size: 3vh; margin-top: 1vh; }
  </style>
</head>
<body>
  <canvas id="fondo" aria-hidden="true"></canvas>
  <div class="sala">
    <div class="sala-cabeza">
      <h1>SALA DE CONTROL<small>CODEXIA · J.A.R.V.I.S.</small></h1>
      <span style="flex:1"></span>
      <div class="controles no-imprimir">
        <button class="btn btn-chico" id="b-jarvis">JARVIS</button>
        <button class="btn btn-chico" id="b-marcador">Marcador</button>
        <button class="btn btn-chico" id="b-sonido">🔇 Activar sonido</button>
        <button class="btn btn-chico" id="b-pantalla">⛶</button>
      </div>
      <div class="contador" id="contador"></div>
    </div>
    <div id="cuerpo" style="min-height:0"></div>
  </div>
  <script type="module" src="js/sala.js"></script>
</body>
</html>
